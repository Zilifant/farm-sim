name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catches catastrophic slowdowns. The committed baseline was recorded
      # on a different machine, so the tolerance is deliberately loose here
      # (the plan anticipates CI-runner noise); run `pnpm bench:check`
      # locally with the default ±20% for a strict comparison.
      - name: Benchmark regression check
        run: pnpm bench:check
        env:
          BENCH_TOLERANCE: "0.5"
