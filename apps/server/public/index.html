<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>farm-sim — ASCII renderer</title>
    <link rel="stylesheet" href="/renderer/app/styles/dracula.css" />
    <link rel="stylesheet" href="/renderer/app/styles/renderer.css" />
  </head>
  <body>
    <div id="app">
      <header id="status-bar"></header>
      <!-- Four columns: events, the map, markets, and the sidebar. Each aside
         carries a drag handle on its *inner* edge (the one facing the map),
         placed in the same grid track as the column it resizes so it overlays
         the column edge rather than taking a track of its own. -->
      <div id="main">
        <aside id="events-column" class="panel-column">
          <section id="event-log-panel" aria-label="Farm event log"></section>
        </aside>
        <div
          class="col-resizer"
          data-resize="events-column"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          title="Drag to resize · arrow keys to nudge · double-click to reset"
        ></div>
        <div id="viewport-wrap">
          <canvas
            id="farm-canvas"
            tabindex="0"
            role="img"
            aria-label="ASCII map view of the farm. Fields, crops, and growth stages are drawn as colored monospace characters; click a field to open its floating window with details and actions."
          ></canvas>
          <div
            id="field-window"
            class="field-window"
            role="dialog"
            aria-label="Selected field details and actions"
            hidden
          ></div>
        </div>
        <aside id="population-column" class="panel-column">
          <section id="metrics-panel" aria-label="Commodity markets"></section>
        </aside>
        <div
          class="col-resizer"
          data-resize="population-column"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          title="Drag to resize · arrow keys to nudge · double-click to reset"
        ></div>
        <aside id="sidebar" class="panel-column">
          <section
            id="controls-panel"
            aria-label="Simulation and camera controls"
          ></section>
          <section id="farm-panel" aria-label="Farm management"></section>
          <section id="legend-panel" aria-label="Glyph legend"></section>
        </aside>
        <div
          class="col-resizer"
          data-resize="sidebar"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          title="Drag to resize · arrow keys to nudge · double-click to reset"
        ></div>
      </div>
      <footer id="help-bar">
        drag or arrows/WASD to pan (shift = fast) &middot; +/- or wheel zoom
        &middot; click a field or open land for its window &middot; F draw a
        field &middot; R build dirt roads (shift-drag removes) &middot; C
        recenter &middot; Esc close &middot; Space pause/resume &middot; [ ]
        speed &middot; drag a column edge to resize it
      </footer>
    </div>
    <script type="module" src="/renderer/app/main.js"></script>
  </body>
</html>
